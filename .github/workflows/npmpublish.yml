name: Node.js Package

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 is an LTS line that every npm 11.x and 12.x supports;
          # Node 25 is not — npm 12 requires ^22.22.2 || ^24.15.0 || >=26.0.0.
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
