version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: "increase"
    ignore:
      # typescript-eslint has no release that supports TypeScript 7 yet.
      - dependency-name: "typescript"
        versions: [">=7"]
